<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Generador de links · Bautizo Leonardo David</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--blue-deep:#56709f;--blue:#7f9ccb;--blue-pale:#d9e3f4;--blue-wash:#eef3fb;--ink:#2e3440;--muted:#5c6475}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;background:var(--blue);color:var(--ink);min-height:100vh;padding:24px 14px}
  .card{max-width:560px;margin:0 auto;background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 14px 40px rgba(40,60,100,.3)}
  h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:2.8rem;color:var(--blue-deep);text-align:center;line-height:1.1}
  .sub{text-align:center;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:4px 0 22px}
  label{display:block;font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--blue-deep);font-weight:600;margin:14px 0 6px}
  input,textarea{width:100%;border:1px solid var(--blue-pale);border-radius:10px;padding:11px 13px;font:inherit;font-size:.92rem;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--blue)}
  .row{display:flex;gap:10px}.row>div:first-child{flex:1}.row>div:last-child{width:90px}
  button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;text-decoration:none;
    background:var(--blue);color:#fff;font:inherit;font-weight:600;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;
    padding:11px 16px;border-radius:8px;transition:background .2s}
  button:hover,.btn:hover{background:var(--blue-deep)}
  .ghost{background:var(--blue-wash);color:var(--blue-deep)}.ghost:hover{background:var(--blue-pale)}
  .main-btn{width:100%;margin-top:18px}
  .tabs{display:flex;gap:6px;margin-bottom:6px}
  .tabs button{flex:1}.tabs button.off{background:var(--blue-wash);color:var(--blue-deep)}
  .hint{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.5}
  .list{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .item{border:1px solid var(--blue-pale);border-radius:12px;padding:12px 14px}
  .item .who{font-weight:600;font-size:.88rem}.item .who span{font-weight:400;color:var(--muted)}
  .item .url{font-size:.72rem;color:var(--blue-deep);word-break:break-all;margin:6px 0 10px}
  .item .acts{display:flex;gap:8px;flex-wrap:wrap}
  .item .acts>*{flex:1;min-width:120px}
  .wa{background:#25a35a}.wa:hover{background:#1d8a4b}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:.8rem;opacity:0;transition:.3s;pointer-events:none}
  .toast.on{opacity:1}
  .all{margin-top:14px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Links de invitados</h1>
  <p class="sub">Bautizo de Leonardo David</p>

  <div class="tabs">
    <button id="tOne">Uno por uno</button>
    <button id="tMany" class="off">Lista completa</button>
  </div>

  <div id="one">
    <div class="row">
      <div><label for="nom">Nombre del invitado</label><input id="nom" placeholder="Familia García"></div>
      <div><label for="pas">Pases</label><input id="pas" type="number" min="1" max="12" value="2"></div>
    </div>
    <button class="main-btn" id="genOne">Generar link</button>
  </div>

  <div id="many" style="display:none">
    <label for="lista">Un invitado por renglón: nombre, pases</label>
    <textarea id="lista" rows="8" placeholder="Familia García, 4&#10;Tía Lupita, 2&#10;Karla y Jorge, 2"></textarea>
    <p class="hint">Puedes pegar dos columnas copiadas de Excel o Google Sheets (nombre y pases).</p>
    <button class="main-btn" id="genMany">Generar todos</button>
  </div>

  <div class="list" id="out"></div>
  <button class="ghost all main-btn" id="copyAll">Copiar todos los links</button>
</div>
<div class="toast" id="toast">¡Copiado!</div>

<script>
  // Dirección pública de la invitación (misma carpeta que este generador)
  const BASE = location.origin + location.pathname.replace(/generador\.html$/, '');
  const $ = s => document.querySelector(s);
  let generated = [];

  const toast = t => { $('#toast').textContent = t; $('#toast').classList.add('on'); setTimeout(() => $('#toast').classList.remove('on'), 1400); };
  const copy = t => navigator.clipboard.writeText(t).then(() => toast('¡Copiado!'), () => prompt('Copia el link:', t));

  function linkFor(nombre, pases) {
    const p = Math.min(12, Math.max(1, parseInt(pases, 10) || 2));
    return { nombre, pases: p, url: `${BASE}?nombre=${encodeURIComponent(nombre)}&pases=${p}` };
  }
  function mensaje(g) {
    return `¡Hola ${g.nombre}! Con mucho cariño te invitamos al bautizo de Leonardo David. Tenemos ${g.pases} ${g.pases === 1 ? 'lugar reservado' : 'lugares reservados'} para ti. Aquí está tu invitación:\n${g.url}`;
  }
  function render() {
    $('#out').innerHTML = '';
    generated.forEach((g, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = `<div class="who"></div><div class="url"></div>
        <div class="acts">
          <button data-c="${i}">Copiar link</button>
          <button class="ghost" data-m="${i}">Copiar mensaje</button>
          <a class="btn wa" target="_blank" rel="noopener">Enviar WhatsApp</a>
          <a class="btn ghost" target="_blank" rel="noopener">Ver</a>
        </div>`;
      d.querySelector('.who').innerHTML = '';
      d.querySelector('.who').append(g.nombre, Object.assign(document.createElement('span'), { textContent: ` · ${g.pases} ${g.pases === 1 ? 'pase' : 'pases'}` }));
      d.querySelector('.url').textContent = g.url;
      const [wa, ver] = d.querySelectorAll('a');
      wa.href = 'https://wa.me/?text=' + encodeURIComponent(mensaje(g));
      ver.href = g.url;
      $('#out').appendChild(d);
    });
    $('#copyAll').style.display = generated.length > 1 ? 'flex' : 'none';
  }
  $('#out').addEventListener('click', e => {
    const c = e.target.closest('[data-c]'), m = e.target.closest('[data-m]');
    if (c) copy(generated[c.dataset.c].url);
    if (m) copy(mensaje(generated[m.dataset.m]));
  });

  $('#genOne').onclick = () => {
    const n = $('#nom').value.trim();
    if (!n) { $('#nom').focus(); return; }
    generated = [linkFor(n, $('#pas').value)];
    render();
  };
  $('#nom').addEventListener('keydown', e => { if (e.key === 'Enter') $('#genOne').click(); });

  $('#genMany').onclick = () => {
    generated = $('#lista').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = l.match(/^(.*?)[\s,;\t]+(\d+)\s*$/);
      return m ? linkFor(m[1].replace(/[,;\t]+$/, '').trim(), m[2]) : linkFor(l, 2);
    });
    render();
  };
  $('#copyAll').onclick = () => copy(generated.map(g => `${g.nombre} (${g.pases}): ${g.url}`).join('\n'));

  $('#tOne').onclick = () => { $('#one').style.display = ''; $('#many').style.display = 'none'; $('#tOne').classList.remove('off'); $('#tMany').classList.add('off'); };
  $('#tMany').onclick = () => { $('#many').style.display = ''; $('#one').style.display = 'none'; $('#tMany').classList.remove('off'); $('#tOne').classList.add('off'); };
</script>
</body>
</html>
